[package]
name = "mcp_intruder"
version = "0.5.7"
edition = "2021"
authors = ["Deamon <contact@example.com>"]
description = "Scanner offensif modulaire (DNS, ports, TLS, HTTP) + 17 modules lecture-seule de preuve d'impact (chainx dispatcher) + catalogue PostgreSQL (13 tables)"
license = "Apache-2.0"
repository = "https://github.com/DeamonDev888/mcp-intruder-scanner"
homepage = "https://github.com/DeamonDev888/mcp-intruder-scanner"
keywords = ["security", "recon", "scanner", "audit", "pentest"]
categories = ["security", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1"
postgres = "0.19"