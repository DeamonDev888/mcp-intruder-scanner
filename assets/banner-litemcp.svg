<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800" role="img" aria-label="LiteMCP - 24 outils MCP, 340 skills, 39 modules de scan">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080e"/>
      <stop offset="50%" stop-color="#0e1019"/>
      <stop offset="100%" stop-color="#090c13"/>
    </linearGradient>
    <radialGradient id="hot2" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff224e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff224e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1d2030" stroke-width="0.8" opacity="0.6"/>
      <circle cx="60" cy="0" r="1.2" fill="#00e5ff" opacity="0.3"/>
    </pattern>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="litemcpGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff224e"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="800" fill="url(#bg2)"/>
  <rect width="1920" height="800" fill="url(#grid2)"/>
  <rect width="1920" height="800" fill="url(#hot2)"/>
  <rect width="1920" height="800" fill="url(#cool2)"/>

  <!-- top strip -->
  <text x="70" y="46" font-family="monospace" font-size="18" fill="#5a6078" letter-spacing="2">SERVEUR MCP // MODEL CONTEXT PROTOCOL</text>
  <text x="1850" y="46" text-anchor="end" font-family="monospace" font-size="18" fill="#5a6078" letter-spacing="2">STREAMABLE HTTP // LITEMCP 0.9</text>
  <line x1="70" y1="62" x2="1850" y2="62" stroke="#232637" stroke-width="1"/>

  <!-- title -->
  <text x="70" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="120" font-weight="800" fill="url(#litemcpGrad)" filter="url(#glow2)">litemcp</text>
  <text x="72" y="292" font-family="monospace" font-size="23" fill="#8a90a8" letter-spacing="3">LE MOTEUR OFFENSIF EXPOSE AUX AGENTS IA VIA LE PROTOCOLE MCP</text>
  <text x="72" y="336" font-family="monospace" font-size="19" fill="#5a6078">POST /mcp  ·  GET /health  ·  bind 127.0.0.1:7808  ·  zero runtime async  ·  serde uniquement</text>

  <!-- left card : outils -->
  <g transform="translate(70,400)">
    <rect width="540" height="300" rx="12" fill="#10121c" stroke="#2b2f45" stroke-width="1.5"/>
    <text x="28" y="48" font-family="monospace" font-size="21" fill="#ff224e" font-weight="bold" filter="url(#glow2)">24 OUTILS MCP</text>
    <text x="28" y="80" font-family="monospace" font-size="15" fill="#8a90a8">scan_target · scan_history · tools_diag</text>
    <text x="28" y="106" font-family="monospace" font-size="15" fill="#8a90a8">dns_audit · tls_audit · http_audit · waf_detect</text>
    <text x="28" y="132" font-family="monospace" font-size="15" fill="#8a90a8">whois_audit · geo_locate · email_sec_audit</text>
    <text x="28" y="158" font-family="monospace" font-size="15" fill="#8a90a8">subdomains_audit · crt_sh_lookup · dnsrecon_audit</text>
    <text x="28" y="184" font-family="monospace" font-size="15" fill="#8a90a8">dns_hardening_audit · tech_stack_audit · ping</text>
    <text x="28" y="210" font-family="monospace" font-size="15" fill="#8a90a8">job_start · job_status · job_result · job_list · job_stop</text>
    <line x1="28" y1="228" x2="512" y2="228" stroke="#232637" stroke-width="1"/>
    <text x="28" y="258" font-family="monospace" font-size="16" fill="#00e5ff" font-weight="bold">+3 SKILLS TOOLS</text>
    <text x="28" y="284" font-family="monospace" font-size="15" fill="#8a90a8">skills_catalog · skills_search · skills_show</text>
  </g>

  <!-- middle card : 340 skills -->
  <g transform="translate(640,400)">
    <rect width="540" height="300" rx="12" fill="#10121c" stroke="#2b2f45" stroke-width="1.5"/>
    <text x="28" y="48" font-family="monospace" font-size="21" fill="#2ecc71" font-weight="bold" filter="url(#glow2)">340 SKILLS INDEXES</text>
    <text x="28" y="82" font-family="monospace" font-size="15" fill="#c8cde0">bughunter</text>
    <text x="500" y="82" text-anchor="end" font-family="monospace" font-size="15" fill="#f5f6fa">83 skills</text>
    <text x="28" y="112" font-family="monospace" font-size="15" fill="#c8cde0">acs</text>
    <text x="500" y="112" text-anchor="end" font-family="monospace" font-size="15" fill="#f5f6fa">257 skills</text>
    <text x="28" y="142" font-family="monospace" font-size="15" fill="#c8cde0">optional — 5 packs</text>
    <text x="500" y="142" text-anchor="end" font-family="monospace" font-size="15" fill="#f5f6fa">201 skills</text>
    <text x="28" y="172" font-family="monospace" font-size="14" fill="#5a6078">acs-red-team 35 · acs-cloud 66 · acs-container 33</text>
    <text x="28" y="194" font-family="monospace" font-size="14" fill="#5a6078">acs-ot-ics 29 · bughunter-opt 38</text>
    <line x1="28" y1="216" x2="512" y2="216" stroke="#232637" stroke-width="1"/>
    <text x="28" y="246" font-family="monospace" font-size="15" fill="#8a90a8">skills_catalog · skills_search (ET-logique)</text>
    <text x="28" y="272" font-family="monospace" font-size="15" fill="#8a90a8">skills_show — SKILL.md complet par id</text>
  </g>

  <!-- right card : auto-detection docker -->
  <g transform="translate(1210,400)">
    <rect width="640" height="300" rx="12" fill="#10121c" stroke="#2b2f45" stroke-width="1.5"/>
    <text x="28" y="48" font-family="monospace" font-size="21" fill="#ffd75f" font-weight="bold" filter="url(#glow2)">AUTO-DETECTION D'ENVIRONNEMENT</text>
    <text x="28" y="84" font-family="monospace" font-size="15.5" fill="#c8cde0">Kali natif</text>
    <text x="612" y="84" text-anchor="end" font-family="monospace" font-size="15.5" fill="#2ecc71">execution native</text>
    <text x="28" y="116" font-family="monospace" font-size="15.5" fill="#c8cde0">macOS · Windows · Linux (Docker actif)</text>
    <text x="612" y="116" text-anchor="end" font-family="monospace" font-size="15.5" fill="#ffd75f">conteneur kali-rolling</text>
    <text x="28" y="148" font-family="monospace" font-size="15.5" fill="#c8cde0">outillage manquant</text>
    <text x="612" y="148" text-anchor="end" font-family="monospace" font-size="15.5" fill="#8a90a8">installe au 1er scan</text>
    <line x1="28" y1="172" x2="612" y2="172" stroke="#232637" stroke-width="1"/>
    <text x="28" y="202" font-family="monospace" font-size="15" fill="#8a90a8">39 modules de scan · 21 bins d'impact</text>
    <text x="28" y="228" font-family="monospace" font-size="15" fill="#8a90a8">catalogue PostgreSQL · Wizard de configuration</text>
    <text x="28" y="254" font-family="monospace" font-size="15" fill="#8a90a8">TUI interactive · sortie JSON pure (--json)</text>
    <text x="28" y="284" font-family="monospace" font-size="14" fill="#5a6078">MCP_INTRUDER_NO_DOCKER=1 pour desactiver le fallback</text>
  </g>

  <!-- bottom bar -->
  <g transform="translate(70,740)">
    <rect width="1780" height="42" rx="8" fill="#0b0d15" stroke="#232637" stroke-width="1.5"/>
    <circle cx="30" cy="21" r="6" fill="#ff224e"/>
    <circle cx="54" cy="21" r="6" fill="#ffd75f"/>
    <circle cx="78" cy="21" r="6" fill="#2ecc71"/>
    <text x="104" y="27" font-family="monospace" font-size="15" fill="#8a90a8">github.com/DeamonDev888/</text>
    <text x="344" y="27" font-family="monospace" font-size="15" fill="#f5f6fa">mcp-intruder-scanner</text>
    <text x="570" y="27" font-family="monospace" font-size="15" fill="#5a6078">·</text>
    <text x="590" y="27" font-family="monospace" font-size="15" fill="#8a90a8">crates.io/crates/</text>
    <text x="760" y="27" font-family="monospace" font-size="15" fill="#f5f6fa">mcp_intruder</text>
    <text x="920" y="27" font-family="monospace" font-size="15" fill="#5a6078">·</text>
    <text x="940" y="27" font-family="monospace" font-size="15" fill="#00e5ff">v0.6.7</text>
    <text x="1756" y="27" text-anchor="end" font-family="monospace" font-size="15" fill="#2ecc71" font-weight="bold">24 OUTILS · 340 SKILLS</text>
  </g>
</svg>
