      <line x1="78" y1="34" x2="88" y2="28"/>
      <line x1="78" y1="66" x2="88" y2="72"/>
      <line x1="50" y1="82" x2="50" y2="88"/>
      <line x1="22" y1="66" x2="12" y2="72"/>
      <line x1="22" y1="34" x2="12" y2="28"/>
    </g>
