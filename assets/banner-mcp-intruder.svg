  <!-- ==================== TITLE LOCKUP ==================== -->
  <g class="sans" font-weight="900">
    <text x="285" y="258" font-size="112" letter-spacing="-2.5" class="white" textLength="340" lengthAdjust="spacingAndGlyphs">mcp</text>
    <text x="640" y="258" font-size="112" font-weight="200" class="dim">/</text>
    <text x="700" y="258" font-size="112" letter-spacing="-2.5" class="red-bright" filter="url(#glow-red)" textLength="580" lengthAdjust="spacingAndGlyphs">intruder</text>
