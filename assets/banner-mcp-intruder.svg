    <circle cx="50" cy="18" r="1.8" fill="#00e5ff"/>
    <circle cx="78" cy="34" r="1.8" fill="#00e5ff"/>
    <circle cx="78" cy="66" r="1.8" fill="#00e5ff"/>
    <circle cx="50" cy="82" r="1.8" fill="#00e5ff"/>
    <circle cx="22" cy="66" r="1.8" fill="#00e5ff"/>
    <circle cx="22" cy="34" r="1.8" fill="#00e5ff"/>

    <!-- THE OFFICIAL KALI LINUX / BACKTRACK DRAGON -->
    <g transform="translate(50, 49) scale(0.145) translate(-202.5, -276.5)">
      <path d="m69.929 127.71c-29.464.0337-48.949 2.4206-48.949 2.4206s107.73-5.1706 194.03 29.769c2.9338 13.122 11.759 34.976 16.513 45.481-13.602 9.4041-28.94 18.249-31.328 49.612-2.3877 31.362 24.576 58.947 58.013 59.798 31.751 1.6913 53.688 1.9323 80.277 15.718 25.38 14.034 46.192 56.794 48.251 95.252 2.2244-28.534-8.4845-89.895-58.453-108.53 69.826 12.219 75.982 63.973 75.984 63.994 0 0 5.2056-59.754-88.677-73.531-11.899-1.7458-26.947-3.0899-42.168-3.1283-75.246.99487-77.989-86.786-21.288-91.218 23.499-1.9389 51.556 10.738 78.986 23.512-.10182 3.4068.0405 6.4339 2.2787 9.2314 2.2375 2.7966 10.832 5.8474 13.579 7.4233 2.7464 1.5764 11.545 7.1715 16.937 14.189 1.1692-2.1872 10.933-8.5432 10.933-8.5432s-2.3391.0507-7.781-1.9832c-5.4426-2.0339-11.9-8.1876-12.053-8.5432-.15246-.35625-.25501-.91601 1.0169-1.1705.96572-.81305-1.2209-3.4575-2.1873-4.4232-.96572-.96636-7.4247-11.95-7.5769-12.204-.15245-.25447-.20376-.50931-.66105-.81465-1.4244-.45805-7.6799.66106-7.6799.66106s-9.6211-4.7252-12.937-14.913c.0482 1.7844-1.6497 3.734 0 7.8335-5.0162-2.122-9.325-5.7416-12.723-14.685-2.0227 5.0868 0 8.3215 0 8.3215s-11.811-3.3016-13.701-14.195c-2.0742 4.8902 0 7.8316 0 7.8316s-19.258-10.048-51.255-10.194c-21.422-1.965-25.882-39.65-23.897-45.994 0 0-30.899-16.285-91.723-23.479-22.809-2.6982-44.081-3.5238-61.76-3.5036zm71.276 32.521c-9.2697.0699-19.22.41577-29.674 1.1588-55.751 3.9628-112.04 23.477-112.04 23.477s115.18-28.98 211.77-11.971h.002l-2.512-8.1057s-27.374-4.862-67.542-4.5594zm68.293 17.263c-9.75-.0412-40.02 1.1848-85.564 15.436-57.124 17.874-89.522 43.21-89.522 43.21s85.141-47.539 181.24-50.24l-2.7492-8.3176s-1.1564-.0779-3.4064-.0875zm62.559-.13932c26.38 10.723 49.34 24.931 67.165 44.514l.002.002 4.2794-.27998s-24.518-29.746-71.447-44.236zm72.712 57.183 5.2496 3.8672c.65793-1.1408 3.31 6.0651 4.9229 8.0668.0683.3997-2.6812 3.6124-3.6164 3.42-.0787-.41087-4.3494-1.6449-4.3494-1.6449s-4.853-2.932-5.5451-3.8847c-.6926-.9527 3.0007-9.1925 3.3383-9.8244z" fill="#ff224e" stroke="#ff224e" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- Glowing Cyber Eye on the Kali Dragon -->
    <circle cx="43.5" cy="41" r="1.8" fill="#00e5ff" filter="url(#glow-cyan)"/>

    <!-- MCP-Auto-Jailbreak Lightning Spear Accent (Piercing Downward) -->
    <path d="M 50 16 L 52 28 L 48 33 L 53 43 L 47 52 L 52 52 L 50 84" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="miter" opacity="0.85" filter="url(#glow-cyan)"/>

    <!-- Center Laser Target Reticle Core -->
    <circle cx="50" cy="50" r="2.2" fill="#00e5ff" filter="url(#glow-cyan)"/>
