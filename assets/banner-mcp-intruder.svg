    <!-- Precision Corner Brackets -->
    <path d="M 8 22 L 8 8 L 22 8" fill="none" stroke="#ff224e" stroke-width="1.8" opacity="0.85"/>
    <path d="M 78 8 L 92 8 L 92 22" fill="none" stroke="#ff224e" stroke-width="1.8" opacity="0.85"/>
    <path d="M 8 78 L 8 92 L 22 92" fill="none" stroke="#ff224e" stroke-width="1.8" opacity="0.85"/>
    <path d="M 92 78 L 92 92 L 78 92" fill="none" stroke="#ff224e" stroke-width="1.8" opacity="0.85"/>

    <!-- Outer Reticle System -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#ff224e" stroke-width="2.2" stroke-dasharray="64 8 64 8"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#ff224e" stroke-width="1" opacity="0.45" stroke-dasharray="3 4"/>
    <circle cx="50" cy="50" r="29" fill="#ff224e" fill-opacity="0.08" stroke="#00e5ff" stroke-width="0.8" opacity="0.55"/>

    <!-- Crosshair Calibration Axis -->
    <g stroke="#ff224e" stroke-width="2.6" stroke-linecap="round">
      <line x1="50" y1="0" x2="50" y2="12"/>
      <line x1="50" y1="88" x2="50" y2="100"/>
      <line x1="0" y1="50" x2="12" y2="50"/>
