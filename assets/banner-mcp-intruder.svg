<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800" role="img" aria-label="MCP Intruder - Serveur MCP offensif - 24 outils, 340 skills, 39 modules de scan, 21 bins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080e"/>
      <stop offset="50%" stop-color="#0e1019"/>
      <stop offset="100%" stop-color="#090c13"/>
    </linearGradient>
    <radialGradient id="hot" cx="18%" cy="26%" r="48%">
      <stop offset="0%" stop-color="#ff224e" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ff224e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ff224e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="84%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent-purple" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1d2030" stroke-width="0.8" opacity="0.6"/>
      <circle cx="60" cy="0" r="1.2" fill="#ff224e" opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="800" fill="url(#bg)"/>
  <rect width="1920" height="800" fill="url(#grid)"/>
  <rect width="1920" height="800" fill="url(#hot)"/>
  <rect width="1920" height="800" fill="url(#cool)"/>
  <rect width="1920" height="800" fill="url(#accent-purple)"/>

  <!-- top strip -->
  <text x="70" y="42" font-family="monospace" font-size="17" fill="#5a6078" letter-spacing="2">PLAN DE CONTROLE MCP // SERVEUR STREAMABLE HTTP</text>
  <text x="1850" y="42" text-anchor="end" font-family="monospace" font-size="17" fill="#5a6078" letter-spacing="2">v0.6.7 // RUST // LITEMCP</text>
  <line x1="70" y1="58" x2="1850" y2="58" stroke="#232637" stroke-width="1"/>

  <!-- logo reticle -->
  <g transform="translate(150,240)" filter="url(#glow)">
    <circle r="86" fill="none" stroke="#ff224e" stroke-width="4" opacity="0.9"/>
    <circle r="60" fill="none" stroke="#ff224e" stroke-width="1.5" opacity="0.5" stroke-dasharray="6 5"/>
    <circle r="20" fill="#ff224e" opacity="0.92"/>
    <line x1="-110" y1="0" x2="-62" y2="0" stroke="#ff224e" stroke-width="3"/>
    <line x1="62" y1="0" x2="110" y2="0" stroke="#ff224e" stroke-width="3"/>
    <line x1="0" y1="-110" x2="0" y2="-62" stroke="#ff224e" stroke-width="3"/>
    <line x1="0" y1="62" x2="0" y2="110" stroke="#ff224e" stroke-width="3"/>
  </g>
  <text x="150" y="405" text-anchor="middle" font-family="monospace" font-size="17" fill="#8a90a8" letter-spacing="4">CONTROL PLANE</text>

  <!-- title -->
  <text x="300" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="150" font-weight="800" fill="#f5f6fa">mcp</text>
  <text x="700" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="150" font-weight="300" fill="#3a3f55">/</text>
  <text x="790" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="150" font-weight="800" fill="#ff224e" filter="url(#glow)">intruder</text>
  <text x="302" y="350" font-family="monospace" font-size="24" fill="#8a90a8" letter-spacing="3">SERVEUR MCP OFFENSIF // DOCKER - LOCAL - VPS - SSH</text>
  <text x="302" y="395" font-family="monospace" font-size="20" fill="#5a6078">Plan de controle universel : cycle de vie asynchrone (lancer / suivre / recuperer / arreter), 39 modules, 21 bins.</text>

  <!-- live card (top right) -->
  <g transform="translate(1420,100)">
    <rect width="430" height="150" rx="10" fill="#10121c" stroke="#2b2f45" stroke-width="1.5"/>
    <circle cx="32" cy="36" r="6" fill="#2ecc71" filter="url(#glow)"/>
    <text x="52" y="42" font-family="monospace" font-size="17" fill="#c8cde0">SERVEUR MCP</text>
    <rect x="316" y="22" width="96" height="28" rx="14" fill="#12351f" stroke="#2ecc71" stroke-width="1"/>
    <text x="364" y="41" text-anchor="middle" font-family="monospace" font-size="14" fill="#2ecc71">LIVE</text>
    <text x="24" y="82" font-family="monospace" font-size="15.5" fill="#8a90a8">TRANSPORT</text>
    <text x="406" y="82" text-anchor="end" font-family="monospace" font-size="15.5" fill="#f5f6fa">Streamable HTTP</text>
    <text x="24" y="110" font-family="monospace" font-size="15.5" fill="#8a90a8">BIND</text>
    <text x="406" y="110" text-anchor="end" font-family="monospace" font-size="15.5" fill="#00e5ff">127.0.0.1:7808</text>
    <text x="24" y="138" font-family="monospace" font-size="15.5" fill="#8a90a8">OUTILS</text>
    <text x="406" y="138" text-anchor="end" font-family="monospace" font-size="15.5" fill="#ff224e">24 outils · 39 modules · 21 bins</text>
  </g>

  <!-- feature cards -->
  <g font-family="monospace">
    <!-- card 1 -->
    <g transform="translate(70,470)">
      <text x="0" y="0" font-size="18" fill="#ff224e">&gt;</text>
      <text x="24" y="0" font-size="18" fill="#f5f6fa" font-weight="bold">24 OUTILS MCP NATIFS</text>
      <text x="24" y="28" font-size="15" fill="#8a90a8">scan_target, dns/tls/http/email_audit, waf_detect,</text>
      <text x="24" y="50" font-size="15" fill="#8a90a8">subdomains_audit, crt_sh_lookup, tools_diag...</text>
    </g>
    <!-- card 2 -->
    <g transform="translate(660,470)">
      <text x="0" y="0" font-size="18" fill="#ff224e">&gt;</text>
      <text x="24" y="0" font-size="18" fill="#f5f6fa" font-weight="bold">39 MODULES DE SCAN KALI</text>
      <text x="24" y="28" font-size="15" fill="#8a90a8">RustScan, Nmap Deep, Nuclei, FFuF, WAF, WhatWeb,</text>
      <text x="24" y="50" font-size="15" fill="#8a90a8">SSLScan, DNSrecon, SQLMap, Obscura + 25 categories</text>
    </g>
    <!-- card 3 -->
    <g transform="translate(1250,470)">
      <text x="0" y="0" font-size="18" fill="#ff224e">&gt;</text>
      <text x="24" y="0" font-size="18" fill="#f5f6fa" font-weight="bold">CYCLE DE VIE ASYNCHRONE</text>
      <text x="24" y="28" font-size="15" fill="#8a90a8">orchestrateur autonome : job_start, job_status,</text>
      <text x="24" y="50" font-size="15" fill="#8a90a8">job_result, job_list, job_stop — 21 bins d'impact</text>
    </g>
  </g>

  <!-- big counters -->
  <g font-family="monospace" text-anchor="middle">
    <text x="180" y="640" font-size="74" font-weight="bold" fill="#00e5ff" filter="url(#glowCyan)">24</text>
    <text x="180" y="672" font-size="15" fill="#5a6078" letter-spacing="2">OUTILS MCP</text>
    <text x="480" y="640" font-size="74" font-weight="bold" fill="#00e5ff" filter="url(#glowCyan)">39</text>
    <text x="480" y="672" font-size="15" fill="#5a6078" letter-spacing="2">MODULES SCAN</text>
    <text x="780" y="640" font-size="74" font-weight="bold" fill="#00e5ff" filter="url(#glowCyan)">21</text>
    <text x="780" y="672" font-size="15" fill="#5a6078" letter-spacing="2">BINS IMPACT</text>
    <text x="1080" y="640" font-size="74" font-weight="bold" fill="#00e5ff" filter="url(#glowCyan)">340</text>
    <text x="1080" y="672" font-size="15" fill="#5a6078" letter-spacing="2">SKILLS</text>
    <text x="1380" y="640" font-size="74" font-weight="bold" fill="#ff224e" filter="url(#glow)">ASYNC</text>
    <text x="1380" y="672" font-size="15" fill="#5a6078" letter-spacing="2">CYCLE DE VIE</text>
    <text x="1680" y="640" font-size="74" font-weight="bold" fill="#ffd75f">RUST</text>
    <text x="1680" y="672" font-size="15" fill="#5a6078" letter-spacing="2">ZERO RUNTIME ASYNC</text>
  </g>

  <!-- terminal status bar -->
  <g transform="translate(70,710)">
    <rect width="1780" height="60" rx="8" fill="#0b0d15" stroke="#232637" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="6" fill="#ff224e"/>
    <circle cx="54" cy="30" r="6" fill="#ffd75f"/>
    <circle cx="78" cy="30" r="6" fill="#2ecc71"/>
    <text x="104" y="36" font-family="monospace" font-size="16" fill="#8a90a8">mcp-intruder</text>
    <text x="238" y="36" font-family="monospace" font-size="16" fill="#f5f6fa">mcp_server --bind 127.0.0.1:7808 --db mcp_intruder_audit</text>
    <text x="1756" y="36" text-anchor="end" font-family="monospace" font-size="16" fill="#2ecc71" font-weight="bold">PLAN DE CONTROLE ACTIF</text>
  </g>
</svg>
