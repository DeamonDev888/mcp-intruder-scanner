<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800" role="img" aria-label="MCP Intruder - Plan de controle universel - 340 skills, 39 modules de scan, 19 bins d'impact">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080e"/>
      <stop offset="50%" stop-color="#0e1019"/>
      <stop offset="100%" stop-color="#090c13"/>
    </linearGradient>

    <radialGradient id="hot" cx="18%" cy="26%" r="48%">
      <stop offset="0%" stop-color="#ff224e" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ff224e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ff224e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cool" cx="84%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="accent-purple" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1d2030" stroke-width="0.8" opacity="0.6"/>
      <circle cx="60" cy="0" r="1.2" fill="#ff224e" opacity="0.3"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", "Fira Code", "IBM Plex Mono", Menlo, monospace; }
      .muted { fill: #9da0b5; }
      .dim { fill: #5c6075; }
      .white { fill: #f8f9fc; }
      .red { fill: #ff224e; }
      .red-bright { fill: #ff3b65; }
      .cyan { fill: #00e5ff; }
      .amber { fill: #ffb703; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="800" fill="url(#bg)"/>
  <rect width="1920" height="800" fill="url(#grid)"/>
  <rect width="1920" height="800" fill="url(#hot)"/>
  <rect width="1920" height="800" fill="url(#cool)"/>
  <rect width="1920" height="800" fill="url(#accent-purple)"/>

  <!-- Top Decorative Tech Accents -->
  <g class="mono" opacity="0.55">
    <path d="M 0 0 L 260 0 L 280 20 L 0 20 Z" fill="#ff224e" opacity="0.15"/>
    <text x="18" y="14" font-size="9" fill="#ff224e" font-weight="700" letter-spacing="1.5">PLAN DE CONTRÔLE MCP // 359 BUNDLE</text>
  </g>

  <!-- Meta Header Row -->
  <g class="mono" font-size="12" letter-spacing="2.2">
    <circle cx="82" cy="52" r="3.5" fill="#ff224e" filter="url(#glow-red)"/>
    <text x="96" y="56" class="dim">MCP-INTRUDER <tspan fill="#3a3e52">/</tspan> <tspan class="red-bright">PLAN DE CONTRÔLE UNIVERSEL</tspan> <tspan fill="#3a3e52">/</tspan> DOCKER · LOCAL · VPS · SSH</text>
    <text x="1840" y="56" text-anchor="end" class="dim">BUNDLE: <tspan class="red-bright">340 SKILLS</tspan> · <tspan class="cyan">39 MODULES SCAN</tspan> · <tspan class="red-bright">19 BINS IMPACT</tspan></text>
  </g>
  <line x1="80" y1="76" x2="1840" y2="76" stroke="#1c2030" stroke-width="1.2"/>
  <line x1="80" y1="76" x2="310" y2="76" stroke="#ff224e" stroke-width="1.8"/>

    <!-- ==================== LOGO MARK : OFFICIAL KALI/BACKTRACK DRAGON & MCP RETICLE ==================== -->
