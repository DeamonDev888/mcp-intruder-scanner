name: Release multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a builder (ex: v0.6.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, toolchain cible)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install PostgreSQL (client pour les tests live optionnels)
        uses: shogo82148/actions-setup-postgresql@v1
        with:
          postgresql-version: '16'

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Tests
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release --bins

      - name: Smoke test (--version + tools)
        shell: bash
        run: |
          ./target/release/mcp_intruder --version
          ./target/release/mcp_server --version

      - name: Package (tar.gz + zip)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG="mcp-intruder-${{ matrix.label }}"
          mkdir -p "dist/$PKG"
          cp target/release/mcp_intruder "dist/$PKG/"
          cp target/release/mcp_server "dist/$PKG/"
          cp LICENSE "dist/$PKG/" 2>/dev/null || true
          cp README.md "dist/$PKG/" 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && zip -r "$PKG.zip" "$PKG")
          else
            tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-intruder-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publication de la release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MCP Intruder ${{ inputs.tag || github.ref_name }} — binaires multi-OS
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true
