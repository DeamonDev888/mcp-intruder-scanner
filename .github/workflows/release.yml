name: Release multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a builder (ex: v0.6.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + toolchain cible)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Tests
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release --bins

      - name: Smoke test (les deux binaires repondent)
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --quiet --bin mcp_intruder -- --version
          cargo run --release --quiet --bin mcp_server -- --version
          # wizard --status sort 1 quand l'outillage n'est pas encore installe
          # (cas normal sur un runner : pas de Kali natif, image Docker a tirer)
          # -> diagnostic affiche mais non bloquant en CI
          cargo run --release --quiet --bin wizard -- --status || echo "[smoke] wizard --status : outillage non configure sur ce runner (attendu)"
          cargo run --release --quiet --bin dashboard -- --help

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PKG="mcp-intruder-${{ matrix.label }}"
          mkdir -p "dist/$PKG"
          cp target/release/mcp_intruder "dist/$PKG/"
          cp target/release/mcp_server "dist/$PKG/"
          cp target/release/wizard "dist/$PKG/"
          cp target/release/dashboard "dist/$PKG/"
          cp LICENSE "dist/$PKG/" 2>/dev/null || true
          cp README.md "dist/$PKG/" 2>/dev/null || true
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          ls -la dist/

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'mcp-intruder-${{ matrix.label }}'
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item 'target/release/mcp_intruder.exe' "dist/$pkg/"
          Copy-Item 'target/release/mcp_server.exe'  "dist/$pkg/"
          Copy-Item 'target/release/wizard.exe'       "dist/$pkg/"
          Copy-Item 'target/release/dashboard.exe'   "dist/$pkg/"
          Copy-Item 'LICENSE'   "dist/$pkg/" -ErrorAction SilentlyContinue
          Copy-Item 'README.md' "dist/$pkg/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-intruder-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publication de la release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MCP Intruder ${{ inputs.tag || github.ref_name }} — binaires multi-OS
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true
